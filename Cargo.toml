[workspace]
resolver = "3"
members = ["todav/core", "todav/app", "todav/cli", "todav/linux/app"]
# Its own workspace: see its Cargo.toml.
exclude = ["todav/ffi"]

# One version for the whole app, set by the Release workflow (scripts/release.py).
[workspace.package]
version = "1.3.0"
edition = "2024"
license = "GPL-3.0-or-later"
