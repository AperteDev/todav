name: CI

on:
  push:
  pull_request:
  # The Release workflow builds through this one, with the version it releases.
  workflow_call:
    inputs:
      version:
        description: Version to build as (scripts/release.py sets it), such as 0.2.0
        required: false
        type: string

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-24.04
    # GNOME 51's GTK and libadwaita, which the app builds against.
    container: fedora:45
    steps:
      - name: Install the build dependencies
        run: >-
          dnf install -y --setopt=install_weak_deps=False
          git gcc gtk4-devel libadwaita-devel libsecret-devel glib2-devel sqlite-devel
          blueprint-compiler gettext
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Unit tests; the integration tests need a Nextcloud account.
      - run: cargo test --workspace --locked

  bindings:
    name: Bindings (Kotlin, C#)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: todav/ffi
      # uniffi-bindgen-cs, built by the script at the version it names.
      - uses: actions/cache@v6
        with:
          path: target/tools
          key: uniffi-bindgen-cs-${{ hashFiles('scripts/bindings.sh') }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: current
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      # msgfmt, for the catalog the smoke tests read.
      - run: sudo apt-get install -y --no-install-recommends gettext
      - run: cargo fmt --check
        working-directory: todav/ffi
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: todav/ffi
      # The bindings generated and run against the library built for Linux.
      - run: scripts/bindings.sh

  flatpak:
    name: Flatpak
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - name: Set the release version
        if: env.VERSION != ''
        run: python3 scripts/release.py "$VERSION" > /dev/null
      # flatpak-builder copies the sources (without target/) and builds them from scratch: Cargo's
      # output is kept between runs instead, with the build's target/ linked to it. Only the CI's
      # copy of the manifest is changed, local and Flathub builds stay as they are.
      - name: Restore Cargo's build output
        uses: actions/cache@v6
        with:
          path: target/flatpak-cargo
          key: flatpak-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: flatpak-cargo-
      - name: Build into it
        run: |
          dir="$PWD/target/flatpak-cargo"
          mkdir -p "$dir"
          manifest=todav/linux/flatpak/dev.aperte.Todav.json
          jq --arg dir "$dir" '."build-options"."build-args" += ["--filesystem=" + $dir]
            | .modules[0]."build-commands" |= ["ln -sfn " + $dir + " target"] + .' \
            "$manifest" > "$manifest.ci" && mv "$manifest.ci" "$manifest"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: todav/linux/flatpak/dev.aperte.Todav.json
          bundle: dev.aperte.Todav.flatpak
          artifact-name: todav-flatpak

  tarball:
    name: Tarball
    runs-on: ubuntu-24.04
    # The oldest supported GNOME (49, for libadwaita 1.8): its glibc keeps the binary running on
    # newer distributions, the .deb's Ubuntu among them. Move on when it reaches its end of life.
    container: fedora:43
    steps:
      - name: Install the build dependencies
        run: >-
          dnf install -y --setopt=install_weak_deps=False
          git gcc make python3 gtk4-devel libadwaita-devel libsecret-devel glib2-devel
          sqlite-devel blueprint-compiler gettext
      - uses: actions/checkout@v7
      - name: Set the release version
        if: env.VERSION != ''
        run: python3 scripts/release.py "$VERSION" > /dev/null
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: make -C todav/linux stage PREFIX=/usr DESTDIR="$PWD/target/stage"
      # Files only: extracted into /, directory entries would reset the system's own.
      - name: Pack the staged tree
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          (cd target/stage && find . ! -type d | sort) |
            tar -C target/stage -czf "target/todav-$version-$(uname -m).tar.gz" -T -
      - uses: actions/upload-artifact@v7
        with:
          name: todav-tarball
          path: target/todav-*.tar.gz
          if-no-files-found: error

  deb:
    name: Debian package
    needs: tarball
    runs-on: ubuntu-24.04
    # The Ubuntu LTS the package is for; dpkg-shlibdeps names its libraries.
    container: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install the packaging tools and the libraries the app links to
        run: >-
          apt-get update && apt-get install -y --no-install-recommends
          dpkg-dev libgtk-4-1 libadwaita-1-0 libsecret-1-0 libsqlite3-0
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: todav-tarball
          path: target
      - name: Build the package from the tarball's tree
        run: |
          tarball=$(ls target/todav-*.tar.gz)
          version=$(basename "$tarball" | sed 's/^todav-\(.*\)-[^-]*\.tar\.gz$/\1/')
          mkdir target/stage && tar -C target/stage -xzf "$tarball"
          scripts/deb.sh target/stage "$version" target/deb
      - name: Install it, so its dependencies are checked
        run: apt-get install -y ./target/deb/*.deb
      - uses: actions/upload-artifact@v7
        with:
          name: todav-deb
          path: target/deb/*.deb
          if-no-files-found: error

  extension:
    name: GNOME Shell extension
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set the release version
        if: env.VERSION != ''
        run: python3 scripts/release.py "$VERSION" > /dev/null
      # msgfmt, for the translations in its locale/.
      - run: sudo apt-get install -y --no-install-recommends gettext
      - run: make -C todav/gnome-extension pack
      - uses: actions/upload-artifact@v7
        with:
          name: todav-extension
          path: target/todav@aperte.dev.shell-extension.zip
          if-no-files-found: error
