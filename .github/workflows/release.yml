name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 0.2.0
        required: true
        type: string

permissions:
  contents: write

concurrency: release

jobs:
  # Checks and packages with the version set; nothing is committed or tagged unless this passes.
  build:
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ inputs.version }}
    # The Android signing key.
    secrets: inherit

  publish:
    name: Commit, tag and publish
    needs: build
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Set the version and move Unreleased changes and links under it
        run: python3 scripts/release.py "$VERSION" > "$RUNNER_TEMP/notes.md"
      - name: Commit and tag the release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "chore(release): $VERSION"
          git tag "v$VERSION"
          git push --atomic origin "HEAD:$GITHUB_REF_NAME" "v$VERSION"
      - uses: actions/download-artifact@v8
        with:
          pattern: todav-*
          path: dist
          merge-multiple: true
      # The Flatpak bundle, the tarball, the .deb, the extension zip and the APK.
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v$VERSION" dist/*
          --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
      # The Fedora RPMs: COPR builds the tag with .copr/Makefile. COPR_CONFIG is the API token
      # file from https://copr.fedorainfracloud.org/api/, which expires after 180 days.
      - name: Build on COPR
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          pipx install copr-cli
          printf '%s\n' "$COPR_CONFIG" > "$RUNNER_TEMP/copr"
          copr-cli --config "$RUNNER_TEMP/copr" buildscm --nowait \
            --clone-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" --commit "v$VERSION" \
            --spec todav/linux/rpm/todav.spec --method make_srpm selfref/todav
