name: Feature request
description: Suggest something Todav could do
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to do?
      description: The task or situation, and what is missing or hard about it now.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Your idea of how it would look or behave, if you have one; other apps that do it well are welcome too.
  - type: dropdown
    id: part
    attributes:
      label: Part of Todav
      options:
        - Tasks
        - Calendar
        - GNOME Shell extension
        - Sync and accounts
        - Something else
