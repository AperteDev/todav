name: Bug report
description: Something in Todav (GNOME or Android) or its GNOME Shell extension does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a task list
        2. …
  - type: input
    id: version
    attributes:
      label: Todav version
      description: Shown in About Todav (main menu on GNOME, Settings on Android).
      placeholder: '1.1.0'
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installed from
      options:
        - Flatpak
        - AUR
        - .deb package
        - Tarball
        - AppImage
        - Android APK from GitHub
        - Android, through Obtainium
        - Built from source
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: On GNOME, the distribution and GNOME version; on Android, the device and Android version.
      placeholder: 'Fedora 44, GNOME 50; or Pixel 9, Android 16'
    validations:
      required: true
  - type: dropdown
    id: account
    attributes:
      label: Connected through
      options:
        - GNOME Online Accounts
        - Browser sign-in or app password
        - Calendars of the accounts on this Android device
        - On this device only (no account)
  - type: input
    id: nextcloud
    attributes:
      label: Nextcloud version
      description: With an account; and whether the WebDAV Push app and ntfy are used.
      placeholder: '32, WebDAV Push with ntfy'
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: On GNOME, what Todav prints when started from a terminal with `todav-linux` (Flatpak `flatpak run dev.aperte.Todav`), after quitting the running one with Ctrl+Q. On Android, the output of `adb logcat --pid=$(adb shell pidof -s dev.aperte.todav)` while you reproduce the problem.
      render: text
