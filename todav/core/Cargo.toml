[package]
name = "todav-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
p256 = { version = "0.14.0", default-features = false, features = ["ecdh", "alloc"] }
quick-xml = "0.42.0"
ring = "0.17"
# 0.38 is what Fedora packages; the system SQLite, as distributions want.
rusqlite = ">=0.38, <0.41"
ureq = "3.4.2"

# The system's certificate authorities (net.rs); Android's come from the app.
[target.'cfg(not(target_os = "android"))'.dependencies]
ureq = { version = "3.4.2", features = ["platform-verifier"] }

[features]
integration = []
