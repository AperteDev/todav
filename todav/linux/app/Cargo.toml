[package]
name = "todav-linux"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "todav-linux"
path = "src/main.rs"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_7"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
libc = "0.2.190"
libsecret = "0.9.0"
todav-app = { path = "../../app" }
todav-core = { path = "../../core" }
