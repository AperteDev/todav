org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true

# What the build needs from the SDK, in one place: the build scripts use them and sdk.sh installs
# exactly these, so Gradle never downloads copies of its own into the shared SDK.
todav.platform=android-37.0
todav.buildTools=37.0.0
todav.ndk=30.0.16248370
todav.minSdk=29
# The emulator's image, for developing apps: stock Android 17 with Google Play (Play services and
# Store, so Google accounts sync as on a phone; a user build: no `adb root`). Noogle uses it too,
# rooting only its AVDs' own copies. Android 15's images don't fold a foldable AVD.
todav.image=system-images;android-37.0;google_apis_playstore;x86_64

# The ABIs the core is built for; `make run` builds only the emulator's (x86_64).
todav.abis=arm64-v8a,x86_64

# The release's version code (1.2.3 is 10203), set by scripts/release.py; F-Droid reads it here.
todav.versionCode=20300
# The cargo-ndk CI and F-Droid build releases with, so their builds match (with the NDK above and
# the Rust in todav/ffi/rust-toolchain.toml).
todav.cargoNdk=4.1.2
