org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true

# What the build needs from the SDK, in one place: the build scripts use them and sdk.sh installs
# exactly these, so Gradle never downloads copies of its own into the shared SDK.
todav.platform=android-37.0
todav.buildTools=37.0.0
todav.ndk=30.0.16248370
todav.minSdk=29
# The emulator's image: Noogle's default (scripts/setup-avd.sh there), so one copy serves both
# projects. It has Chrome, for signing in with the browser.
todav.image=system-images;android-35;google_apis_playstore;x86_64

# The ABIs the core is built for; `make run` builds only the emulator's (x86_64).
todav.abis=arm64-v8a,x86_64
